<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>PdfJsKit - Module Bundle Test</title>
  <link rel="stylesheet" href="test.css">
  <script type="module" src="pdfjskit/pdfjskit.min.mjs"></script>
</head>
<body>

  <main>
    <header>
      <h1>PdfViewer Showcase <span>Module Bundle Test</span></h1>

      <label class="theme-picker">
        Large UI Sizing
        <input type="checkbox" id="uiSizing">
      </label>
      <label>
        Theme
        <select id="theme">
          <option value="slate" selected>Slate</option>
          <option value="white">White</option>
          <option value="classic-light">Classic Light</option>
          <option value="classic-dark">Classic Dark</option>
        </select>
      </label>
    </header>

    <div id="container"></div>
  </main>

  <script type="module">
    import { PdfViewer, PageUtil } from "./pdfjskit/pdfjskit.min.mjs"

    var pdfViewer = new PdfViewer({
      documentUrl: "pdfjskit/sample.pdf",
      width: "100%",
      height: "100%",
      //resizable: true,
      //language: "en-US",
      //theme: "slate, classic-dark"
    });

    pdfViewer.render(document.getElementById("container"));


    var themeElement = document.getElementById("theme");
    themeElement.addEventListener("change", () => {
      pdfViewer.theme = themeElement.value;
    });

    var uiSizingElement = document.getElementById("uiSizing");
    uiSizingElement.checked = (pdfViewer.uiSizing === "large");
    uiSizingElement.addEventListener("change", () => {
      pdfViewer.uiSizing = uiSizingElement.checked ? "large" : "normal";
    });
  </script>

</body>
</html>
